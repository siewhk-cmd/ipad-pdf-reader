<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no,
                 viewport-fit=cover">

    <meta name="theme-color" content="#111111">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">

    <title>PDF Reader</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>

<body>

    <div id="startScreen">
        <h1>PDF Reader</h1>

        <label class="openButton">
            Open PDF
            <input
                id="pdfFile"
                type="file"
                accept="application/pdf">
        </label>

        <div id="savedSection" class="hidden">
            <h2>Saved PDFs</h2>
            <div id="savedPdfList"></div>
        </div>
    </div>

    <div id="reader" class="hidden">

        <div id="topBar">

            <button id="libraryButton">
                Library
            </button>

            <button id="openAnother">
                Open PDF
            </button>

            <div id="fileName">
                PDF
            </div>

            <div id="pageInfo">
                <span id="pageNum">1</span>
                /
                <span id="pageCount">1</span>
            </div>

        </div>

        <div id="pdfArea">
            <canvas id="pdfCanvas"></canvas>
        </div>

    </div>

    <script type="module" src="app.js"></script>

</body>
</html>
